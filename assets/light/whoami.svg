<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="218" viewBox="0 0 1000 218" role="img" aria-label="About Arav">

    <style>
      :root { --ink:#252525; --muted:#777; --line:#d8d8d8; --panel:#f7f7f7; --accent:#555; }
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .eyebrow { fill:var(--muted); font-size:13px; letter-spacing:2px; }
      .heading { fill:var(--ink); font-size:25px; font-weight:650; letter-spacing:.2px; }
      .body { fill:var(--ink); font-size:16px; }
      .small { fill:var(--muted); font-size:14px; }
      .label { fill:var(--muted); font-size:12px; letter-spacing:1.5px; }
      .rule { stroke:var(--line); stroke-width:1; stroke-dasharray:1000; stroke-dashoffset:1000; animation:drawLine 1.5s cubic-bezier(.6,0,.2,1) forwards; }
@keyframes drawLine { to { stroke-dashoffset:0; } }
      .panel { fill:var(--panel); stroke:var(--line); stroke-width:1; }
      .accent { fill:var(--accent); }
      @media (prefers-color-scheme: dark) {
        :root { --ink:#e6e6e6; --muted:#929292; --line:#333; --panel:#111; --accent:#bdbdbd; }
      }
    </style>
    
<rect width="100%" height="100%" fill="transparent"/>

<text x="28" y="28" class="eyebrow">ABOUT / CURRENT DIRECTION</text>
<text x="28" y="62" class="heading">Building things, understanding how they work.</text>
<text x="28" y="94" class="body">I'm Arav, an aspiring software developer focused on building practical</text>
<text x="28" y="117" class="body">web applications and strengthening my foundations in computer science.</text>
<path d="M28 140 H972" class="rule"/>
<text x="28" y="166" class="label">FOCUS</text>
<text x="110" y="166" class="small">Backend development · Full-stack applications · AI / ML · Problem solving</text>
<text x="28" y="193" class="label">CURRENTLY LEARNING</text>
<text x="205" y="193" class="small">Django REST Framework · React · Microservices · DSA · System design</text>

</svg>