<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="245" viewBox="0 0 1000 245" role="img" aria-label="Education and experience timeline">

    <style>
      :root { --ink:#252525; --muted:#777; --line:#d8d8d8; --panel:#f7f7f7; --accent:#555; }
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .eyebrow { fill:var(--muted); font-size:13px; letter-spacing:2px; }
      .heading { fill:var(--ink); font-size:25px; font-weight:650; letter-spacing:.2px; }
      .body { fill:var(--ink); font-size:16px; }
      .small { fill:var(--muted); font-size:14px; }
      .label { fill:var(--muted); font-size:12px; letter-spacing:1.5px; }
      .rule { stroke:var(--line); stroke-width:1; stroke-dasharray:1000; stroke-dashoffset:1000; animation:drawLine 1.5s cubic-bezier(.6,0,.2,1) forwards; }
@keyframes drawLine { to { stroke-dashoffset:0; } }
      .panel { fill:var(--panel); stroke:var(--line); stroke-width:1; }
      .accent { fill:var(--accent); }
      @media (prefers-color-scheme: dark) {
        :root { --ink:#e6e6e6; --muted:#929292; --line:#333; --panel:#111; --accent:#bdbdbd; }
      }
    </style>
    
<rect width="100%" height="100%" fill="transparent"/>

<text x="28" y="27" class="eyebrow">THE ROUTE SO FAR / EDUCATION &amp; EXPERIENCE</text>
<path d="M72 60 V270" class="rule"/>
<circle cx="72" cy="78" r="5" class="accent"/><text x="100" y="75" class="label">EDUCATION</text>
<text x="100" y="98" class="body">B.Sc. Computer Science · Kannur University</text>
<circle cx="72" cy="150" r="5" class="accent"/><text x="100" y="147" class="label">AI / ML INTERN</text>
<text x="100" y="170" class="body">Ziya Technology · Kochi</text>
<text x="100" y="220" class="small">Continuing to learn, build, and grow as a software developer.</text>

</svg>